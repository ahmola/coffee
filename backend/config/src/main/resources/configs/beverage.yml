server:
  port: 8090

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/coffee?serverTimeZone=Asia/Seoul&characterEncoding=UTF-8
    username: user
    password: user
    initialization-mode: always
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect